services:
  # HustleRadar Web Frontend
  - type: web
    name: hustleradar-web
    env: static
    buildCommand: npm install --include=dev && npm run build --workspace=apps/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: hustleradar-api
          property: host

  # HustleRadar Backend API & AI Agent Engine
  - type: web
    name: hustleradar-api
    env: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build --workspace=apps/server
    startCommand: npm run start --workspace=apps/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERPAPI_KEY
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL_NAME
        value: gemma-2-9b-it
